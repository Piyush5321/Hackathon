<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navio | Smart Travel Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ===== GLOBAL ===== */
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 20px;
    }

    /* ===== MAIN CARD ===== */
    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #ffffff;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
    }

    .container:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    /* ===== SECTION CARDS ===== */
    .section-card {
      background: #f1f5f9;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    .section-card:hover {
      background: #e2e8f0;
    }

    label {
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
    }

    /* ===== INPUTS ===== */
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      box-shadow: 0 0 0 1px #cbd5f5;
      transition: 0.25s;
    }

    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.25);
    }

    /* ===== ROW ===== */
    .row {
      display: flex;
      gap: 32px;
    }

    /* ===== PLACES ===== */
    .places-box {
      background: white;
      padding: 12px;
      border-radius: 12px;
    }

    .place-item {
      margin-bottom: 10px;
    }

    .place-chip {
      width: 100%;
      background: #fff7ed;
      border: 2px dashed #f97316;
      color: #9a3412;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .place-chip:hover {
      background: #ffedd5;
      transform: translateY(-2px);
    }

    .plus {
      font-size: 20px;
      font-weight: 600;
    }

    /* ===== BUDGET ===== */
    .budget-options {
      display: flex;
      gap: 14px;
    }

    .budget-card {
      flex: 1;
      padding: 16px;
      background: white;
      text-align: center;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.25s;
    }

    .budget-card.active {
      background: #f97316;
      color: white;
      transform: scale(1.05);
    }

    /* ===== TRAVEL TYPE ===== */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .checkbox-group input {
      display: none;
    }

    .checkbox-group span {
      background: white;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.25s;
      display: inline-block;
    }

    .checkbox-group input:checked + span {
      background: #0f172a;
      color: white;
    }

    /* ===== SEASON DROPDOWN ===== */
    .season-dropdown {
      position: relative;
      width: 100%;
    }

    .season-selected {
      background: white;
      padding: 14px 18px;
      border-radius: 16px;
      border: 2px solid #f97316;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
    }

    .season-options {
      display: none;
      margin-top: 12px;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .season-options div {
      background: white;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid #e2e8f0;
      text-align: center;
      cursor: pointer;
      transition: 0.25s;
    }

    .season-options div:hover {
      border-color: #f97316;
      background: #fff7ed;
      transform: translateY(-2px);
    }

    .season-dropdown.active .season-options {
      display: grid;
    }

    /* ===== BUTTON ===== */
    button {
      width: 100%;
      padding: 16px;
      background: #f97316;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }

    button:hover {
      background: #ea580c;
    }

    /* ===== RESULT ===== */
    .result {
      margin-top: 30px;
      background: #f1f5f9;
      padding: 20px;
      border-radius: 16px;
    }

    .day {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .day h3 {
      margin-bottom: 12px;
      color: #0f172a;
    }

      margin-top: 8px;
      font-size: 14px;
      color: #475569;
    }

    .slot span {
      font-weight: 600;
      color: #0f172a;
    }

    .note {
      font-size: 13px;
      margin-bottom: 15px;
      color: #475569;
      font-weight: 500;
    }
  </style>

</div>

  Manali: ["Solang Valley", "Rohtang Pass", "Hadimba Temple", "Mall Road", "Jogini Waterfall"]
};

const locationSelect = document.getElementById("location");
const placesBox = document.getElementById("places");
const itineraryBox = document.getElementById("itinerary");
const startDate = document.getElementById("startDate");
const endDate = document.getElementById("endDate");
const durationBox = document.getElementById("durationBox");
const output = document.getElementById("output");

let itinerary = [];
let selectedBudget = null;
let selectedSeason = null;

// Location change
locationSelect.addEventListener("change", () => {
  const selected = locationSelect.value;
  placesBox.innerHTML = "";
  itinerary = [];
  itineraryBox.innerText = "No places added yet.";

  if (!placesData[selected]) {
    placesBox.innerText = "Select a destination to see famous places.";
    return;
  }

  placesData[selected].forEach(place => {
    const div = document.createElement("div");
    div.className = "place-item";
    div.innerHTML = `
      <button class="place-chip" onclick="addToItinerary('${place}')">
        <span>${place}</span>
        <span class="plus">+</span>
      </button>
    `;
    placesBox.appendChild(div);
  });
});

function addToItinerary(place) {
  if (!itinerary.includes(place)) {
    itinerary.push(place);
    itineraryBox.innerText = itinerary.join(", ");
  }
}

// Budget selection
document.querySelectorAll(".budget-card").forEach(card => {
  card.addEventListener("click", () => {
    document.querySelectorAll(".budget-card").forEach(c => c.classList.remove("active"));
    card.classList.add("active");
    selectedBudget = card.getAttribute("data-budget");
  });
});

// Calculate days
function calculateDays() {
  if (!startDate.value || !endDate.value) {
    durationBox.innerText = "Select dates to see total days.";
    return;
  }

  const start = new Date(startDate.value);
  const end = new Date(endDate.value);

  if (end < start) {
    durationBox.innerText = "End date must be after start date.";
    return;
  }

  const days = Math.floor((end - start) / (1000 * 60 * 60 * 24)) + 1;
  durationBox.innerText = `${days} days trip planned`;
}

startDate.addEventListener("change", calculateDays);
endDate.addEventListener("change", calculateDays);

// Season dropdown
function toggleSeason() {
  document.querySelector(".season-dropdown").classList.toggle("active");
}

function selectSeason(option) {
  selectedSeason = option.innerText;
  document.querySelector(".season-selected").innerHTML = selectedSeason + " <span>▾</span>";
  document.querySelector(".season-dropdown").classList.remove("active");
}

document.addEventListener("click", function (e) {
  const dropdown = document.querySelector(".season-dropdown");
  if (!dropdown.contains(e.target)) {
    dropdown.classList.remove("active");
  }
});

// Generate itinerary
async function generateItinerary() {

  const destination = locationSelect.value;
  const travelTypes = Array.from(document.querySelectorAll(".checkbox-group input:checked")).map(el => el.value);
  const daysText = durationBox.innerText;
  const days = parseInt(daysText);

  if (!destination || !selectedBudget || !selectedSeason || travelTypes.length === 0 || isNaN(days)) {
    alert("Please fill all required details");
    return;
  }

  output.style.display = "block";
  output.innerHTML = "Generating AI itinerary... ⏳";

  try {

    const aiText = await generateAIItinerary({
      destination: destination,
      days: days,
      budget: selectedBudget,
      season: selectedSeason,
      types: travelTypes
    });

    output.innerHTML = `
      <div class="note">AI Generated Itinerary</div>
      <div class="day">${aiText.replace(/\n/g,"<br>")}</div>
    `;

}
