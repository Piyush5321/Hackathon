<!DOCTYPE html>
<html>
<head>
  <title>All Alerts</title>
  <link rel="stylesheet" href="login.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(102,126,234,0.7), rgba(118,75,162,0.7)), url('../images/bgimg.jpg') center/cover no-repeat fixed;
    }

    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
    }

    .container {
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(10px);
      padding: 80px 120px;
      border-radius: 24px;
      width: 1100px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255,140,0,0.9);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    h2{
      text-align:center;
      font-size:36px;
      margin-bottom:30px;
    }

    input{
      width:100%;
      padding:20px;
      border-radius:12px;
      border:2px solid #ddd;
      margin-bottom:15px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:12px;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
    }

    .search-btn{
      background:linear-gradient(135deg,#8e6ddf,#f18bbf);
      color:white;
    }

    .show-btn{
      background:#999;
      color:white;
    }

    .alert-card{
      padding:20px;
      margin-top:20px;
      border-radius:14px;
      background:rgba(255,247,237,0.9);
      border-left:6px solid orange;
      line-height:1.7;
    }

    .high{
      border-left:6px solid red;
      background:rgba(255,200,200,0.7);
    }

    .weather{
      border-left:6px solid blue;
      background:rgba(200,220,255,0.7);
    }

    .safe{
      border-left:6px solid green;
      background:rgba(200,255,200,0.7);
    }

    .footer{
      margin-top:auto;
      padding:40px;
      text-align:center;
      background:rgba(255,255,255,0.3);
    }
  </style>
</head>

<body>

<div class="main-content">
  <div class="container">

    <button class="back-btn" onclick="window.history.back()">←</button>
    <h2>All Alerts</h2>

    <input type="text" id="searchInput" placeholder="Search by location">

    <button class="search-btn" onclick="searchAlerts()">Search</button>
    <button class="show-btn" onclick="loadAlerts()">Show All</button>

    <div id="alertsList"></div>

  </div>
</div>

<footer class="footer">
  <p><strong>Navio</strong> - Smart Travel Planning Platform</p>
  <p>© 2026 Navio</p>
</footer>

<script type="module">

import { db } from "./firebase.js";
import { collection, getDocs, query, orderBy, where }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const list = document.getElementById("alertsList");


// 🧠 AGENTIC AI DECISION
function getClass(category){
    if(category==="Scam/Fraud" || category==="Safety Issue") return "alert-card high";
    if(category==="Weather") return "alert-card weather";
    return "alert-card safe";
}

function getMessage(category){
    if(category==="Scam/Fraud") return "🔴 High scam risk here";
    if(category==="Safety Issue") return "🔴 Safety warning";
    if(category==="Weather") return "🌧 Weather warning";
    if(category==="Overpricing") return "💰 Overpricing reported";
    return "🟢 Area looks normal";
}


// LOAD ALL
window.loadAlerts = async function(){

    const q = query(collection(db,"alerts"), orderBy("time","desc"));
    const snap = await getDocs(q);

    list.innerHTML="";

    snap.forEach(doc=>{
        const data = doc.data();

        list.innerHTML += `
        <div class="${getClass(data.category)}">
            <b>📍 Location:</b> ${data.location || "-"}<br>
            <b>🏷 Landmark:</b> ${data.landmark || "-"}<br>
            <b>🚨 Category:</b> ${data.category || "-"}<br>
            <b>📝 Details:</b> ${data.details || "-"}<br><br>
            <b>${getMessage(data.category)}</b>
        </div>
        `;
    });
}


// SEARCH
window.searchAlerts = async function(){

    const text = document.getElementById("searchInput").value;

    const q = query(collection(db,"alerts"),
    where("location","==",text));

    const snap = await getDocs(q);

    list.innerHTML="";

    if(snap.empty){
        list.innerHTML="<div class='alert-card'>No alerts found</div>";
        return;
    }

    snap.forEach(doc=>{
        const data = doc.data();

        list.innerHTML += `
        <div class="${getClass(data.category)}">
            <b>📍 Location:</b> ${data.location}<br>
            <b>🏷 Landmark:</b> ${data.landmark}<br>
            <b>🚨 Category:</b> ${data.category}<br>
            <b>📝 Details:</b> ${data.details}<br><br>
            <b>${getMessage(data.category)}</b>
        </div>
        `;
    });
}

loadAlerts();

</script>

</body>
</html>
