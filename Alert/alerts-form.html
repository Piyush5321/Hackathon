<!DOCTYPE html>
<html>
<head>
  <title>Alerts</title>
  <link rel="stylesheet" href="login.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .footer {
      margin-top: auto;
      padding: 20px;
      background: rgba(255,255,255,0.9);
      text-align: center;
      border-top: 1px solid #e5e5e5;
    }

    .footer p { margin: 5px 0; }
    .footer-title { font-size: 14px; color: #666; font-weight: 600; }
    .footer-copy { font-size: 12px; color: #999; }

    select, input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #8e6ddf 0%, #f18bbf 100%);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(142, 109, 223, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(142, 109, 223, 0.4);
    }
  </style>
</head>

<body>

<div class="main-content">
  <div class="container">
    <button onclick="window.history.back()" class="back-btn">←</button>
    <h2>Submit Alert</h2>

    <form id="alertForm">

      <!-- LOCATION -->
      <input type="text" id="location" placeholder="Location" required>

      <!-- LANDMARK -->
      <input type="text" id="landmark" placeholder="Nearby Landmark (optional)">

      <!-- CATEGORY DROPDOWN -->
      <select id="category" required>
        <option value="">Select Alert Category</option>
        <option value="Scam/Fraud">Scam / Fraud</option>
        <option value="Safety Issue">Safety Issue</option>
        <option value="Weather">Weather</option>
        <option value="Overpricing">Overpricing</option>
        <option value="Transportation">Transportation</option>
        <option value="Other">Other</option>
      </select>

      <!-- DETAILS -->
      <textarea id="details" placeholder="Enter details..."
      style="height:120px;"></textarea>

      <button type="submit">Submit Alert</button>
    </form>

    <p id="msg"></p>
  </div>
</div>

<footer class="footer">
  <p class="footer-title"><strong>Navio</strong> - Smart Travel Planning Platform</p>
  <p class="footer-copy">© 2026 Navio. All rights reserved.</p>
</footer>

<script type="module" src="alerts-form.js"></script>
</body>
</html>
