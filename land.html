<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navio Landing Page</title>
    <link rel="stylesheet" href="land.css">
</head>
<body>
   

    <!-- Background Video -->
    <video id="bgVideo" class="bg-video" muted autoplay>
      <source src="images/0211 (2).mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <!-- Get Started Button (hidden initially) -->
    <div id="ctaButton" class="cta-container hidden">
        <button class="get-started-btn">Get Started</button>
    </div>

<footer>   
     <div class="footer-bottom">
      <p>© 2026 Navio. All rights reserved.</p>
    </div>
  </footer>
    <script>
        const ctaButton = document.getElementById('ctaButton');

        // Show button after 2.8 seconds
        setTimeout(function() {
            ctaButton.classList.remove('hidden');
            ctaButton.classList.add('show');
        }, 2800);

        // Add click handler for the button
        document.querySelector('.get-started-btn').addEventListener('click', function() {
            window.location.href = 'home.html';
        });
    </script>
</body>
</html>
