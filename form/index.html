<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navio - Trip Planner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, rgba(106, 90, 205, 0.7), rgba(255, 140, 148, 0.7)), url('../images/bgimg.jpg') center/cover no-repeat fixed;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: 3em;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      .header p {
        font-size: 1.1em;
        opacity: 0.9;
      }

      .content {
        display: block;
        padding: 10px 0;
      }

      .form-section {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        max-width: 820px;
        margin: 0 auto;
      }

      .form-message {
        margin: 12px 0 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fff7e6;
        color: #664d03;
        border: 1px solid #ffe8a3;
      }

      .form-section h2 {
        margin-bottom: 25px;
        color: #333;
        font-size: 1.5em;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        font-size: 0.95em;
      }

      select,
      input[type="number"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-family: "Poppins", sans-serif;
        font-size: 1em;
        transition: border-color 0.3s;
      }

      select:focus,
      input[type="number"]:focus {
        outline: none;
        border-color: #667eea;
      }

      .checkbox-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      .checkbox-item {
        flex: 1;
        min-width: 150px;
      }

      .checkbox-item input {
        display: none;
      }

      .checkbox-item label {
        margin: 0;
        padding: 10px 15px;
        background: #f5f5f5;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        transition: all 0.3s;
      }

      .checkbox-item input:checked + label {
        background: linear-gradient(135deg, #8e6ddf 0%, #f18bbf 100%);
        color: white;
        border-color: #8e6ddf;
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #8e6ddf 0%, #f18bbf 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1.05em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        margin-top: 10px;
        box-shadow: 0 4px 15px rgba(142, 109, 223, 0.3);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(142, 109, 223, 0.5);
      }

      /* Results section removed - form only layout */

      .no-results {
        text-align: center;
        color: #999;
        padding: 40px 20px;
      }

      .filter-info {
        background: #e3f2fd;
        color: #1976d2;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 0.95em;
      }

      @media (max-width: 768px) {
        .content {
          grid-template-columns: 1fr;
        }

        .header h1 {
          font-size: 2em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🌍 Navio</h1>
        <p>Plan Your Perfect Trip</p>
      </div>

      <div class="content">
        <!-- Form Section -->
        <div class="form-section">
          <h2>Filters</h2>

          <div class="form-group">
            <label for="destination">Destination *</label>
            <select id="destination" onchange="filterResults()">
              <option value="">Select Destination</option>
              <option value="Goa">Goa</option>
              <option value="Delhi">Delhi</option>
            </select>
          </div>

          <div class="form-group">
            <label for="budget">Budget *</label>
            <select id="budget" onchange="filterResults()">
              <option value="">Select Budget</option>
              <option value="Low">Low</option>
              <option value="Mid">Mid</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="form-group">
            <label for="season">Season *</label>
            <select id="season">
              <option value="">Select Season</option>
              <option value="Summer">Summer</option>
              <option value="Winter">Winter</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tripType">Type of Trip *</label>
            <div id="tripType" class="checkbox-group">
              <!-- radio buttons inserted dynamically based on destination -->
            </div>
          </div>

          <div class="form-group">
            <label for="startDate">Start Date *</label>
            <input type="date" id="startDate" />
          </div>

          <div class="form-group">
            <label for="endDate">End Date *</label>
            <input type="date" id="endDate" />
          </div>

          <button class="btn" onclick="generateItinerary()">
            Generate Itinerary
          </button>
          <div
            id="formMessage"
            class="form-message"
            style="display: none"
          ></div>
        </div>
        <!-- Activities/results removed per request -->
      </div>
    </div>

    <script>
      let csvData = [];

      // Load CSV file
      fetch("final_database.csv")
        .then((response) => {
          if (!response.ok) {
            throw new Error("CSV file not found");
          }
          return response.text();
        })
        .then((text) => {
          const lines = text.trim().split("\n");
          for (let i = 1; i < lines.length; i++) {
            if (lines[i].trim() === "") continue;
            const values = lines[i].split(",");
            if (values.length < 7) continue;
            const record = {
              destination: values[0].trim(),
              budget: values[1].trim(),
              season: values[2].trim(),
              travel_type: values[3].trim(),
              day: parseInt(values[4].trim()),
              time_slot: values[5].trim(),
              activity: values[6].trim(),
            };
            csvData.push(record);
          }
          console.log("✅ CSV Loaded! Total records:", csvData.length);
          console.log("Sample data:", csvData.slice(0, 3));
        })
        .catch((err) => {
          console.error("❌ Error loading CSV:", err);
          const fm = document.getElementById("formMessage");
          if (fm) {
            fm.style.display = "block";
            fm.textContent =
              "❌ Error loading CSV file. Make sure final_database.csv is in the same folder.";
          }
        });

      // Update trip-type options based on destination
      function updateTripTypeOptions() {
        const dest = document.getElementById("destination").value;
        const container = document.getElementById("tripType");
        container.innerHTML = "";
        if (!dest) return;
        const options =
          dest === "Goa" ? ["Adventure", "Relaxation"] : ["Nature", "Culture"];
        options.forEach((opt, idx) => {
          const id = `trip-${opt.toLowerCase()}`;
          const wrapper = document.createElement("div");
          wrapper.className = "checkbox-item";
          wrapper.innerHTML = `
            <input type="radio" name="tripTypeRadio" id="${id}" value="${opt}" ${idx === 0 ? "checked" : ""} />
            <label for="${id}">${opt}</label>
          `;
          container.appendChild(wrapper);
        });
      }

      document
        .getElementById("destination")
        .addEventListener("change", updateTripTypeOptions);

      function generateItinerary() {
        const destination = document.getElementById("destination").value;
        const budget = document.getElementById("budget").value;
        const season = document.getElementById("season").value;
        const startDateStr = document.getElementById("startDate").value;
        const endDateStr = document.getElementById("endDate").value;

        const tripTypeRadio = document.querySelector(
          'input[name="tripTypeRadio"]:checked',
        );
        const tripType = tripTypeRadio ? tripTypeRadio.value : null;

        if (
          !destination ||
          !budget ||
          !season ||
          !startDateStr ||
          !endDateStr ||
          !tripType
        ) {
          const fm = document.getElementById("formMessage");
          if (fm) {
            fm.style.display = "block";
            fm.textContent = "⚠️ Please fill all fields";
          }
          return;
        }

        const start = new Date(startDateStr);
        const end = new Date(endDateStr);
        if (isNaN(start) || isNaN(end) || end < start) {
          const fm = document.getElementById("formMessage");
          if (fm) {
            fm.style.display = "block";
            fm.textContent =
              "⚠️ Please provide valid start and end dates (end >= start)";
          }
          return;
        }

        // inclusive days
        const msPerDay = 24 * 60 * 60 * 1000;
        const totalDays = Math.floor((end - start) / msPerDay) + 1;

        // Filter data by sequence: day 1..totalDays
        const filtered = csvData.filter((row) => {
          return (
            row.destination === destination &&
            row.budget === budget &&
            row.season === season &&
            row.travel_type === tripType &&
            row.day >= 1 &&
            row.day <= totalDays
          );
        });

        if (filtered.length === 0) {
          const fm = document.getElementById("formMessage");
          if (fm) {
            fm.style.display = "block";
            fm.textContent = "🔍 No activities found for selected filters";
          }
          return;
        }

        // sort by day then time_slot to preserve sequence
        filtered.sort(
          (a, b) => a.day - b.day || a.time_slot.localeCompare(b.time_slot),
        );

        // enrich activities with absolute date strings
        const activities = filtered.map((item) => {
          const date = new Date(start.getTime() + (item.day - 1) * msPerDay);
          return {
            ...item,
            date: date.toISOString().slice(0, 10),
          };
        });

        // build itinerary object and store in sessionStorage
        const itinerary = {
          meta: {
            destination,
            budget,
            season,
            tripType,
            startDate: startDateStr,
            endDate: endDateStr,
            totalDays,
          },
          activities,
        };

        try {
          sessionStorage.setItem("itinerary", JSON.stringify(itinerary));
          // redirect to itinerary page to display editable/printable itinerary
          window.location.href = "itinerary.html";
        } catch (e) {
          console.error("Could not save itinerary:", e);
          const fm = document.getElementById("formMessage");
          if (fm) {
            fm.style.display = "block";
            fm.textContent = "❌ Could not save itinerary to sessionStorage.";
          }
        }
      }
    </script>
  </body>
</html>
