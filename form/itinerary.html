<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Itinerary - Navio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Poppins, system-ui, Arial;
        background:
          linear-gradient(
            135deg,
            rgba(106, 90, 205, 0.7),
            rgba(255, 140, 148, 0.7)
          ),
          url("../images/bgimg.jpg") center/cover no-repeat fixed;
        padding: 24px;
        min-height: 100vh;
      }
      .card {
        max-width: 900px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 6px;
      }
      .meta {
        color: #555;
        margin-bottom: 14px;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .btn {
        background: linear-gradient(135deg, #8e6ddf 0%, #f18bbf 100%);
        color: #fff;
        padding: 10px 12px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        box-shadow: 0 4px 15px rgba(142, 109, 223, 0.3);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(142, 109, 223, 0.5);
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.65);
        color: #8e6ddf;
        backdrop-filter: blur(10px);
      }
      #alertBtn {
        background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
        box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      }
      #alertBtn:hover {
        box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
      }
      .day {
        border-left: 4px solid #8e6ddf;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(8px);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .day-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .act {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .act .info {
        flex: 1;
      }
      .act .activity {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(8px);
        padding: 8px;
        border-radius: 6px;
        border: 1px solid rgba(142, 109, 223, 0.2);
      }
      .small {
        font-size: 0.85rem;
        color: #666;
      }
      .editable {
        outline: none;
      }
      /* ALERT MODAL */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95),
          rgba(240, 230, 255, 0.9)
        );
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 32px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-30px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 2px solid rgba(142, 109, 223, 0.3);
        padding-bottom: 15px;
      }

      .modal-header h2 {
        font-size: 1.5rem;
        color: #8e6ddf;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        color: #8e6ddf;
        transition: transform 0.2s;
      }

      .modal-close:hover {
        transform: rotate(90deg);
      }

      .alert-item {
        background: rgba(142, 109, 223, 0.1);
        padding: 14px;
        border-radius: 8px;
        margin-bottom: 12px;
        border-left: 4px solid #8e6ddf;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .alert-icon {
        font-size: 20px;
        flex-shrink: 0;
        color: #f18bbf;
      }

      .alert-text {
        color: #333;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .no-alerts {
        text-align: center;
        color: #666;
        padding: 20px;
      }

      @media print {
        .controls,
        .btn,
        .modal {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Itinerary</h1>
      <div id="meta" class="meta">Loading...</div>
      <div class="controls">
        <button class="btn" id="saveBtn">Save changes</button>
        <button class="btn ghost" id="backBtn">Back</button>
        <button class="btn" id="printBtn">Print</button>
        <button class="btn ghost" id="exportBtn">Export JSON</button>
        <button class="btn" id="alertBtn">⚠️ Alert</button>
      </div>

      <div id="itineraryList"></div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>⚠️ Safety Alerts for <span id="alertDestination"></span></h2>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <div id="alertList"></div>
      </div>
    </div>

    <script>
      // Safety Alerts Database
      const safetyAlerts = {
        Delhi: [
          "Avoid taxis or autos without meters near railway stations.",
          "Avoid isolated parks after sunset.",
          "Avoid street vendors without visible price boards in tourist areas.",
        ],
        Goa: [
          "Avoid water sports booked through unofficial beach agents.",
          "Avoid isolated beaches late at night.",
          "Avoid accepting drinks from strangers in party areas.",
          "Be cautious when traveling alone at night.",
          "Keep valuables secure in crowded areas.",
        ],
        Mumbai: [
          "Avoid crowded local trains during peak hours if possible.",
          "Keep your belongings secure in busy markets.",
          "Be cautious with street food from unregistered vendors.",
          "Avoid isolated areas in suburbs after dark.",
          "Don't flash expensive jewelry or electronics.",
        ],
        Jaipur: [
          "Avoid unmarked auto-rickshaws, use official ones.",
          "Be wary of unofficial tour guides.",
          "Don't accept food or drinks from strangers.",
          "Keep valuables in hotel safes.",
          "Avoid traveling alone at night.",
        ],
        Bangalore: [
          "Be cautious in crowded IT parks during commute hours.",
          "Avoid isolated tech parks after dark.",
          "Keep your smartphone secure in public transport.",
          "Be aware of ride-sharing scams.",
          "Avoid walking alone late at night.",
        ],
        Kolkata: [
          "Avoid large gatherings during strike periods.",
          "Keep distance from political protests.",
          "Use registered taxis, avoid unmarked cabs.",
          "Avoid walking alone in dimly lit areas.",
          "Be cautious with street food hygiene.",
        ],
        Hyderabad: [
          "Avoid traveling alone at night in old city areas.",
          "Be cautious in crowded shopping districts.",
          "Don't carry large amounts of cash.",
          "Avoid secluded parks after sunset.",
          "Use official transportation services.",
        ],
        Agra: [
          "Avoid unofficial tour guides near tourist spots.",
          "Don't shop at inflated prices in tourist areas.",
          "Avoid traveling with unknown people.",
          "Keep valuables secure at hotels.",
          "Be cautious of 'gem trades' and tourist scams.",
        ],
      };

      function loadItinerary() {
        const raw = sessionStorage.getItem("itinerary");
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch (e) {
          return null;
        }
      }

      function render() {
        const it = loadItinerary();
        const metaDiv = document.getElementById("meta");
        const list = document.getElementById("itineraryList");
        if (!it) {
          metaDiv.textContent =
            "No itinerary found. Return to planner and generate one.";
          list.innerHTML = "";
          return;
        }
        const m = it.meta;
        metaDiv.innerHTML = `<strong>${m.destination}</strong> ·  ${m.budget} ·  ${m.season} ·  ${m.startDate} to ${m.endDate} (${m.totalDays} days) ·  ${m.tripType}`;

        // group by day
        const byDay = {};
        it.activities.forEach((a) => {
          byDay[a.day] = byDay[a.day] || [];
          byDay[a.day].push(a);
        });

        let html = "";
        Object.keys(byDay)
          .sort((a, b) => a - b)
          .forEach((dayNum) => {
            html += `<div class="day" data-day="${dayNum}">
                    <div class="day-header"><div>Day ${dayNum}</div><div class="small">${byDay[dayNum][0].date || ""}</div></div>`;
            byDay[dayNum].forEach((act, idx) => {
              html += `<div class="act">
                      <div class="info">
                        <div class="small">${act.travel_type} · ${act.time_slot}</div>
                        <div class="activity editable" contenteditable="true" data-idx="${act.day}-${idx}">${act.activity}</div>
                      </div>
                    </div>`;
            });
            html += `</div>`;
          });

        list.innerHTML = html;
      }

      function saveChanges() {
        const it = loadItinerary();
        if (!it) return alert("No itinerary to save");
        // read contenteditable fields and update activities
        const editable = document.querySelectorAll(".activity.editable");
        editable.forEach((el) => {
          const key = el.getAttribute("data-idx");
          const parts = key.split("-");
          const day = parseInt(parts[0], 10);
          const idx = parseInt(parts[1], 10);
          // find matching activity (first matching day and index occurrence)
          let count = -1;
          for (let i = 0; i < it.activities.length; i++) {
            if (it.activities[i].day === day) {
              count++;
              if (count === idx) {
                it.activities[i].activity = el.textContent.trim();
                break;
              }
            }
          }
        });
        sessionStorage.setItem("itinerary", JSON.stringify(it));
        alert("Saved to sessionStorage");
      }

      document.getElementById("saveBtn").addEventListener("click", saveChanges);
      document.getElementById("backBtn").addEventListener("click", () => {
        window.history.back();
      });
      document.getElementById("printBtn").addEventListener("click", () => {
        window.print();
      });
      document.getElementById("exportBtn").addEventListener("click", () => {
        const it = loadItinerary();
        if (!it) return alert("No itinerary");
        const blob = new Blob([JSON.stringify(it, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "itinerary.json";
        a.click();
        URL.revokeObjectURL(url);
      });

      // Alert Button Handler
      document.getElementById("alertBtn").addEventListener("click", () => {
        const it = loadItinerary();
        if (!it) return alert("No itinerary found");

        const destination = it.meta.destination;
        const alerts = safetyAlerts[destination] || [];
        const modal = document.getElementById("alertModal");
        const alertDestinationSpan =
          document.getElementById("alertDestination");
        const alertListDiv = document.getElementById("alertList");

        alertDestinationSpan.textContent = destination;

        if (alerts.length === 0) {
          alertListDiv.innerHTML =
            '<div class="no-alerts">No safety alerts available for this destination.</div>';
        } else {
          alertListDiv.innerHTML = alerts
            .map(
              (alert) => `
              <div class="alert-item">
                <span class="alert-icon">⚠️</span>
                <span class="alert-text">${alert}</span>
              </div>
            `,
            )
            .join("");
        }

        modal.classList.add("show");
      });

      // Close Modal
      document.getElementById("closeModal").addEventListener("click", () => {
        document.getElementById("alertModal").classList.remove("show");
      });

      // Close Modal when clicking outside
      document.getElementById("alertModal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("alertModal")) {
          document.getElementById("alertModal").classList.remove("show");
        }
      });

      render();
    </script>
  </body>
</html>
